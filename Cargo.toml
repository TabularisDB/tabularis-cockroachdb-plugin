[package]
name = "cockroachdb-plugin"
version = "0.1.0"
edition = "2021"
description = "CockroachDB driver plugin for Tabularis"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
deadpool-postgres = "0.14.2"
infer = "0.22.0"
percent-encoding = "2.3.2"
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net", "macros", "io-std", "io-util", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["aws-lc-rs"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dev-dependencies]
rcgen = "0.14.10"
