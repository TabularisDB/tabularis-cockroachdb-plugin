[package]
name = "cockroachdb-plugin"
version = "0.1.0"
edition = "2021"
description = "CockroachDB driver plugin for Tabularis"
license = "Apache-2.0"
publish = false

[dependencies]
deadpool-postgres = "0.14.2"
percent-encoding = "2.3.2"
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net", "macros"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["aws-lc-rs"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dev-dependencies]
rcgen = "0.14.10"
